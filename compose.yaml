services:
  mariadb:
    image: mariadb:11
    container_name: playgrounds-db
    environment:
      - MARIADB_DATABASE=playgrounds
      - MARIADB_USER=playgrounds
      - MARIADB_PASSWORD=playgrounds
      - MARIADB_ROOT_PASSWORD=playgrounds-root
      - TZ=America/Panama
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - traefik-net

  playgrounds:
    container_name: playgrounds
    build: .
    image: playgrounds:latest
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 8050:8050
    volumes:
      - ./src:/src
    environment:
      - TZ=America/Panama
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=playgrounds
      - DB_USER=playgrounds
      - DB_PASSWORD=playgrounds
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.playgrounds.rule=Host(`playgrounds.mirai.local`)"
      - "traefik.http.routers.playgrounds.entrypoints=web"
      - "traefik.http.services.playgrounds.loadbalancer.server.port=8050"

networks:
  traefik-net:
    external: true

volumes:
  mariadb-data:
